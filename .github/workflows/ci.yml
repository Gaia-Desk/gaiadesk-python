name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Installs the package's dependencies too (typing_extensions before 3.11, for gaiadesk.types), and cryptography for the end-to-end tests.
      - run: python -m pip install ".[e2e]"
      - run: python -m unittest discover -s tests -v
      - name: Import the installed package from outside the source tree
        shell: bash
        run: |
          cd "$RUNNER_TEMP" && python -c "import gaiadesk, gaiadesk.types; print(gaiadesk.__version__)"
