[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gaiadesk"
version = "0.1.2"
description = "Drive GaiaDesk desks from Python: devices, exec, shell, file copy, background jobs, stats, scoped tokens and MCP, through GaiaDesk's native library (gaiadesk[native]), gaiadesk-cli, or the hosted GaiaDesk API (standard library only)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
# The generated TypedDicts (gaiadesk.types) use NotRequired, in typing from 3.11.
dependencies = ['typing_extensions>=4.0; python_version < "3.11"']
keywords = ["gaiadesk", "remote-desktop", "sdk", "exec", "mcp", "ai-agents"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]

[project.optional-dependencies]
# GaiaDesk's client library as a prebuilt extension (proprietary binary
# licence): with it, the SDK needs no gaiadesk-cli. `pip install gaiadesk[native]`.
native = ["gaiadesk-native>=0.10.324"]
# End-to-end encryption of desk operations over the hosted API (cryptography:
# Apache-2.0 OR BSD-3-Clause). `pip install "gaiadesk[e2e]"`.
e2e = ["cryptography>=42"]

[project.urls]
Homepage = "https://github.com/Gaia-Desk/gaiadesk-python"
Repository = "https://github.com/Gaia-Desk/gaiadesk-python"
Issues = "https://github.com/Gaia-Desk/gaiadesk-python/issues"
Changelog = "https://github.com/Gaia-Desk/gaiadesk-python/blob/main/CHANGELOG.md"
Documentation = "https://gaiadesk.net/docs/cli-for-agents"
Download = "https://gaiadesk.net/download"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gaiadesk = ["py.typed"]

[tool.mypy]
python_version = "3.9"

